<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a0a0f"/>
    <stop offset="1" stop-color="#12121a"/>
  </linearGradient>
  <linearGradient id="glow-gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c9a227" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#c9a227" stop-opacity="0.3"/>
    <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft-glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Background -->
<rect width="1000" height="200" fill="url(#bg)"/>

<!-- Subtle grid lines -->
<line x1="0" y1="100" x2="1000" y2="100" stroke="#1a1a2e" stroke-width="1" opacity="0.4"/>
<line x1="500" y1="0" x2="500" y2="200" stroke="#1a1a2e" stroke-width="1" opacity="0.2"/>

<!-- Stars / particles -->
<circle cx="80" cy="25" r="0.7" fill="#c9a227" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.1s" begin="0s" repeatCount="indefinite"/></circle>
<circle cx="200" cy="55" r="0.5" fill="#fff" opacity="0.4"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="4.2s" begin="0.5s" repeatCount="indefinite"/></circle>
<circle cx="340" cy="18" r="0.8" fill="#fff" opacity="0.3"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle>
<circle cx="470" cy="40" r="0.6" fill="#c9a227" opacity="0.4"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.7s" begin="0.3s" repeatCount="indefinite"/></circle>
<circle cx="610" cy="22" r="0.7" fill="#fff" opacity="0.3"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="5.0s" begin="1.8s" repeatCount="indefinite"/></circle>
<circle cx="740" cy="60" r="0.5" fill="#fff" opacity="0.3"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.3s" begin="0.7s" repeatCount="indefinite"/></circle>
<circle cx="870" cy="35" r="0.8" fill="#c9a227" opacity="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.5s" begin="2.1s" repeatCount="indefinite"/></circle>
<circle cx="950" cy="70" r="0.6" fill="#fff" opacity="0.3"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.6s" begin="1.4s" repeatCount="indefinite"/></circle>
<circle cx="130" cy="85" r="0.5" fill="#fff" opacity="0.2"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.9s" begin="0.9s" repeatCount="indefinite"/></circle>
<circle cx="920" cy="15" r="0.7" fill="#c9a227" opacity="0.3"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="4.1s" begin="2.5s" repeatCount="indefinite"/></circle>
<circle cx="55" cy="165" r="0.5" fill="#fff" opacity="0.2"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.5s" begin="1.2s" repeatCount="indefinite"/></circle>
<circle cx="300" cy="172" r="0.6" fill="#c9a227" opacity="0.3"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="4.8s" begin="0.6s" repeatCount="indefinite"/></circle>
<circle cx="680" cy="178" r="0.5" fill="#fff" opacity="0.2"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.0s" begin="1.9s" repeatCount="indefinite"/></circle>

<!-- One Piece accent: thin horizontal glow line -->
<rect x="0" y="1" width="1000" height="1" fill="url(#glow-gold)" opacity="0.6">
  <animate attributeName="opacity" values="0.3;0.8;0.3" dur="6s" repeatCount="indefinite"/>
</rect>
<rect x="0" y="198" width="1000" height="1" fill="url(#glow-gold)" opacity="0.6">
  <animate attributeName="opacity" values="0.3;0.8;0.3" dur="6s" begin="3s" repeatCount="indefinite"/>
</rect>

<!-- Name: Atharv Nayak — clean, measured, not too big -->
<text x="52" y="98" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" fill="#f0f0f0" letter-spacing="-1" filter="url(#soft-glow)" opacity="0.92">Atharv Nayak</text>

<!-- Thin gold underline accent -->
<rect x="52" y="106" width="280" height="2" rx="1" fill="#c9a227" opacity="0.7">
  <animate attributeName="width" from="0" to="280" dur="1.8s" begin="0.2s" fill="freeze"/>
</rect>

<!-- Subtitle — compact, factual -->
<text x="54" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#888899" letter-spacing="1" font-weight="400">B.TECH ECS · RCOEM NAGPUR · CGPA 9.1</text>

<!-- Role line — animated reveal -->
<text x="54" y="158" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#c9a227" letter-spacing="0.5" opacity="0">
  Full-Stack Developer · Backend · DSA
  <animate attributeName="opacity" from="0" to="0.85" dur="1s" begin="1.5s" fill="freeze"/>
</text>

<!-- Decorative right element: One Piece-inspired subtle Jolly Roger dots (minimalist) -->
<g transform="translate(860, 85)" opacity="0.12">
  <circle cx="0" cy="0" r="28" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="-28" y1="0" x2="28" y2="0" stroke="#c9a227" stroke-width="1"/>
  <line x1="0" y1="-28" x2="0" y2="28" stroke="#c9a227" stroke-width="1"/>
  <circle cx="0" cy="0" r="8" fill="none" stroke="#c9a227" stroke-width="1"/>
</g>

<!-- Vertical accent bar on left -->
<rect x="40" y="65" width="2" height="85" rx="1" fill="#c9a227" opacity="0.5">
  <animate attributeName="height" from="0" to="85" dur="1s" begin="0s" fill="freeze"/>
</rect>
</svg>